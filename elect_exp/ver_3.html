<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전자기 유도 실험</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ef;--panel:#fbfcfb;--ink:#1b2b2c;--mute:#5d6e6e;--line:#cfd8d5;--grid:#e1e8e5;--cu:#b4642a;--n:#c8402f;--s:#2f5fa8;--trace:#08766f;--glass:#dbe7ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#141b1b;--panel:#1c2525;--ink:#e3ecea;--mute:#8fa3a1;--line:#2e3b3b;--grid:#263131;--cu:#e0914f;--n:#e8604d;--s:#5b8fe0;--trace:#3fd1c6;--glass:#2b3a3e}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141b1b;--panel:#1c2525;--ink:#e3ecea;--mute:#8fa3a1;--line:#2e3b3b;--grid:#263131;--cu:#e0914f;--n:#e8604d;--s:#5b8fe0;--trace:#3fd1c6;--glass:#2b3a3e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.55}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 18px;font-size:.92rem}
.top{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
#scene{width:100%;height:460px;display:block}
.ctl{margin-bottom:14px}
.ctl label{display:flex;justify-content:space-between;font-weight:500;font-size:.92rem}
.row{display:flex;gap:10px;align-items:center}
input[type=range]{flex:1;accent-color:var(--cu);min-width:0}
input[type=number],select{width:92px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.u{color:var(--mute);font-size:.85rem;min-width:2.6em}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tab{flex:1;min-width:140px;text-align:left;font-weight:500;font-size:.9rem}.tab[aria-selected=true]{border-color:var(--cu);box-shadow:inset 0 -3px 0 var(--cu);font-weight:700}#desc{margin:0 0 14px;font-size:.92rem}
.btns{display:flex;gap:8px;margin:6px 0 12px}
button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
button.go{background:var(--cu);border-color:var(--cu);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--trace);outline-offset:2px}
.opt{font-size:.88rem;display:flex;gap:8px;align-items:center;margin-bottom:8px}
.read{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.read div{border-top:1px solid var(--line);padding-top:6px;font-size:.82rem;color:var(--mute)}
.read b{display:block;font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums}
#graphbox{margin-top:16px}
#graph{width:100%;height:320px;display:block}
.note{color:var(--mute);font-size:.8rem;margin:8px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0 2px;font-size:.8rem;font-variant-numeric:tabular-nums}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:16px;height:4px;border-radius:2px;display:inline-block}
@media (max-width:820px){.top{grid-template-columns:1fr}#scene{height:400px}}
</style>
</head>
<body>
<main>
<h1>전자기 유도 실험</h1>
<p class="sub">실험을 고르고 값을 정한 뒤 “실험 시작”을 누르세요. 실험마다 기록이 따로 쌓입니다.</p>
<div class="tabs" role="tablist" id="tabs"></div>
<p id="desc"></p>
<div class="top">
  <div class="box"><canvas id="scene"></canvas></div>
  <div class="box">
    <div id="ctls"></div>
    <div class="ctl"><label for="sp">측정 간격 / 재생 속도</label><div class="row"><select id="sp"><option value="0.001">1 ms</option><option value="0.002" selected>2 ms</option><option value="0.005">5 ms</option></select><select id="sl"><option value="1">실제 속도</option><option value="0.5">0.5배속</option><option value="0.25">0.25배속</option><option value="0.1">0.1배속</option></select></div></div>
    <label class="opt" id="brakeRow"><input type="checkbox" id="brake" checked>렌츠 법칙에 의한 자기 제동 반영</label>
    <div class="btns"><button class="go" id="drop">실험 시작</button><button id="reset">초기화</button><button id="clear">기록 지우기</button></div>
    <div class="read">
      <div>경과 시간<b id="rt">0.000 s</b></div><div><span id="il"></span><b id="rv"></b></div>
      <div>현재 유도 전압<b id="re">0.0 mV</b></div><div>최대 / 최소 전압<b id="rp">–</b></div>
    </div>
  </div>
</div>
<div class="box" id="graphbox">
  <strong>시간–유도 전압 그래프</strong> <span class="note">(실험할 때마다 다른 색으로 겹쳐 쌓입니다)</span><div id="legend" class="legend"></div>
  <canvas id="graph"></canvas>
  <p class="note">자석은 이상적인 자기 쌍극자로 근사했고, 실험 #1·#2·#4의 전압은 상대적인 크기를 비교하기 위한 값입니다. 실험 #3은 실제 단위(mT)로 계산합니다.</p>
</div>
</main>
<script>
const $=id=>document.getElementById(id),g=9.8,a=0.03,Lc=0.06,Mg=0.03,floorZ=-0.28,K=30;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const PAL=['#0a8f86','#d1562b','#6b4fd6','#c79a00','#d1407f','#2f7fd1','#5a9a2a','#8a5a3c'];
const S={run:false,t:0,s:[],pmax:0,pmin:0,ymax:.004,last:0,acc:0,done:false};
let st={},M,P,runs;
function emfAt(z,v,p){let s=0;for(let k=0;k<K;k++){const d=z-(-Lc/2+Lc*(k+.5)/K);s+=3*a*a*d/(2*Math.pow(a*a+d*d,2.5))}return p.B*3e-6*p.N*s/K*v}
const dB={k:'B',l:'자석의 세기',s:'B',u:'T',min:.05,max:1.5,step:.05,v:.5},dN={k:'N',l:'코일의 감은 횟수',s:'N',u:'회',min:10,max:2000,step:10,v:500};
const MODES=[
{t:'실험 #1 중력 낙하',il:'현재 속력',sl:.25,brake:true,
 d:'자석을 일정 높이에서 떨어뜨려 코일을 통과시킵니다. 높이·세기·감은 횟수를 바꿔 보세요.',
 defs:[dB,{k:'h',l:'떨어뜨리는 높이',s:'h',u:'m',min:.05,max:2,step:.05,v:.5},dN],
 init(p){st={z:p.h+.03,v:0}},
 step(p,dt){let e=emfAt(st.z,st.v,p),acc=g;if($('brake').checked&&Math.abs(st.v)>1e-3){const R=p.N*.02;acc-=Math.min(g*.98,e*e/(R*Math.abs(st.v))/Mg)}st.v+=acc*dt;st.z-=st.v*dt;return emfAt(st.z,st.v,p)},
 done:()=>st.z<floorZ,xmax:p=>Math.sqrt(2*(p.h+.03-floorZ)/g)*1.08,info:()=>Math.abs(st.v).toFixed(2)+' m/s',
 scene(x,W,H,p){tube(x,W,H,p.h+.03,[[p.h+.03,'낙하 시작 '+p.h.toFixed(2)+' m'],[0,'코일 중심 0']],true,p)}},
{t:'실험 #2 코일 확대',il:'코일 반지름',sl:1,
 d:'자석은 고정하고 코일 반지름만 점점 키웁니다. 코일을 지나는 자속이 변하는 만큼 전압이 생기고, 반지름이 d/√2일 때 자속이 최대라 전압이 0이 됩니다.',
 defs:[dB,{k:'d',l:'자석–코일 면 거리 d',s:'d',u:'cm',min:2,max:10,step:.5,v:4},dN,{k:'u',l:'코일 확대 속도',s:'속도',u:'cm/s',min:1,max:30,step:1,v:10}],
 init(p){st={r:.01}},
 step(p,dt){const u=p.u/100,d=p.d/100,r=st.r;st.r+=u*dt;return -p.N*p.B*3e-6*r*(d*d-2*r*r)/Math.pow(r*r+d*d,2.5)*u},
 done:()=>st.r>=.15,xmax:p=>.14/(p.u/100)*1.02,info:()=>(st.r*100).toFixed(1)+' cm',
 scene(x,W,H,p){const sc=W*.42/.16,cx=W/2,cy=H*.72,d=p.d/100,yc=cy-28-d*H*3.6,rx=st.r*sc;
  x.setLineDash([4,4]);x.strokeStyle=css('--line');x.beginPath();x.moveTo(cx,cy);x.lineTo(cx,yc);x.stroke();x.setLineDash([]);
  x.fillStyle='rgba(180,100,42,.12)';x.beginPath();x.ellipse(cx,yc,rx,rx*.22,0,0,7);x.fill();
  x.strokeStyle=css('--cu');x.lineWidth=3;x.stroke();x.lineWidth=1;
  mag(x,cx,cy,24,64);x.fillStyle=css('--mute');x.font='12px "Noto Sans KR",sans-serif';x.textAlign='left';
  x.fillText('거리 d = '+p.d+' cm',cx+8,(cy+yc)/2);x.fillText('코일 '+p.N+'회, 반지름 '+(st.r*100).toFixed(1)+' cm',12,24);x.fillText('자석은 고정',cx+30,cy+4)}},
{t:'실험 #3 코일 회전',il:'유효 면적 A·cosθ',sl:1,
 d:'균일한 자기장 속에서 코일이 회전합니다. 자기장을 수직으로 통과하는 유효 면적 A·cosθ가 변하므로 전압은 사인 곡선이 됩니다. (자석 사이의 균일한 자기장으로 근사)',
 defs:[{k:'B',l:'코일 위치의 자기장',s:'B',u:'mT',min:10,max:500,step:10,v:100},dN,{k:'r',l:'코일 반지름',s:'r',u:'cm',min:1,max:6,step:.5,v:3},{k:'f',l:'회전 속도',s:'f',u:'회전/s',min:.5,max:5,step:.5,v:1}],
 init(p){st={th:0}},
 step(p,dt){const w=2*Math.PI*p.f,th=w*(S.t+dt),A=Math.PI*Math.pow(p.r/100,2);st.th=th;st.A=A*Math.cos(th);return p.N*p.B/1000*A*w*Math.sin(th)},
 done:()=>S.t>=2,xmax:()=>2,info:()=>((st.A||Math.PI*Math.pow(P.r/100,2))*1e4).toFixed(1)+' cm²',
 scene(x,W,H,p){const cx=W/2,cy=H/2,th=st.th||0,L=Math.min(W,H)*.3*(p.r/6)+14,pw=W*.1;
  x.fillStyle=css('--n');x.fillRect(W*.04,cy-H*.3,pw,H*.6);x.fillStyle=css('--s');x.fillRect(W*.96-pw,cy-H*.3,pw,H*.6);
  x.fillStyle='#fff';x.font='bold 16px sans-serif';x.textAlign='center';x.fillText('N',W*.04+pw/2,cy+5);x.fillText('S',W*.96-pw/2,cy+5);
  x.strokeStyle=css('--mute');x.fillStyle=css('--mute');for(let i=-3;i<=3;i++){const y=cy+i*H*.08,x1=W*.04+pw+8,x2=W*.96-pw-8;x.beginPath();x.moveTo(x1,y);x.lineTo(x2,y);x.lineTo(x2-8,y-4);x.moveTo(x2,y);x.lineTo(x2-8,y+4);x.stroke()}
  const dx=-Math.sin(th)*L,dy=Math.cos(th)*L;x.strokeStyle=css('--cu');x.lineWidth=7;x.lineCap='round';x.beginPath();x.moveTo(cx-dx,cy-dy);x.lineTo(cx+dx,cy+dy);x.stroke();x.lineWidth=1;x.lineCap='butt';
  x.setLineDash([4,4]);x.strokeStyle=css('--trace');x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(th)*60,cy+Math.sin(th)*60);x.stroke();x.setLineDash([]);
  x.fillStyle=css('--mute');x.font='12px "Noto Sans KR",sans-serif';x.textAlign='left';x.fillText('위에서 본 모습 · 점선은 코일 면의 법선',12,24);x.fillText('θ = '+(((th*180/Math.PI)%360)).toFixed(0)+'°',12,H-14)}},
{t:'실험 #4 추천: 흔들어 발전',il:'자석 속력',sl:1,
 d:'추천 실험: 코일 속에서 자석이 위아래로 진동합니다(흔들어 켜는 손전등의 원리). 진동수를 2배로 하면 전압도 약 2배가 되는지, 진폭을 바꾸면 봉우리가 어떻게 달라지는지 겹쳐 비교해 보세요.',
 defs:[dB,dN,{k:'A',l:'진동 진폭',s:'A',u:'cm',min:1,max:15,step:.5,v:5},{k:'f',l:'진동수',s:'f',u:'Hz',min:.5,max:10,step:.5,v:3}],
 init(p){st={z:0,v:0}},
 step(p,dt){const w=2*Math.PI*p.f,t=S.t+dt,A=p.A/100;st.z=A*Math.sin(w*t);st.v=-A*w*Math.cos(w*t);return emfAt(st.z,st.v,p)},
 done:()=>S.t>=2,xmax:()=>2,info:()=>Math.abs(st.v).toFixed(2)+' m/s',
 scene(x,W,H,p){const A=p.A/100;tube(x,W,H,Math.max(A+.02,.1),[[A,'+진폭'],[-A,'−진폭'],[0,'코일 중심']],false,p)}}];
MODES.forEach(m=>{m.p={};m.defs.forEach(q=>m.p[q.k]=q.v);m.runs=[];m.cnt=0});
function mag(x,cx,my,mw,mh){x.fillStyle=css('--n');x.fillRect(cx-mw/2,my-mh/2,mw,mh/2);x.fillStyle=css('--s');x.fillRect(cx-mw/2,my,mw,mh/2);x.fillStyle='#fff';x.font='bold 12px sans-serif';x.textAlign='center';x.fillText('N',cx,my-mh/4+4);x.fillText('S',cx,my+mh/4+4)}
function tube(x,W,H,top,marks,floor,p){
  const cx=W*.42,cy=H*.62;
  const Y=z=>{const ad=Math.abs(z),sg=z>=0?-1:1;if(ad<=.08)return cy+sg*ad*400;if(z>0)return cy-32-(z-.08)/(top-.08)*(cy-32-46);return cy+32+(ad-.08)/.2*(H-cy-32-26)};
  x.strokeStyle=css('--line');x.fillStyle=css('--mute');x.font='12px "Noto Sans KR",sans-serif';x.textAlign='right';
  marks.forEach(([z,t])=>{const y=Y(z);x.setLineDash([4,4]);x.beginPath();x.moveTo(cx-90,y);x.lineTo(cx+90,y);x.stroke();x.setLineDash([]);x.fillText(t,cx-96,y+4)});
  x.fillStyle=css('--glass');x.fillRect(cx-14,36,28,H-52);x.strokeStyle=css('--line');x.strokeRect(cx-14,36,28,H-52);
  if(floor){x.fillStyle=css('--line');x.fillRect(cx-40,H-16,80,8)}
  const turns=Math.min(34,Math.round(4+p.N/70)),cu=css('--cu'),ct=cy-34,ch=68;x.strokeStyle=cu;x.lineWidth=2.4;
  for(let i=0;i<turns;i++){x.beginPath();x.ellipse(cx,ct+(i+.5)*ch/turns,34,7,0,0,7);x.stroke()}x.lineWidth=1;
  const e=S.s.length?S.s[S.s.length-1][1]:0,lvl=Math.min(1,Math.abs(e)/Math.max(S.ymax/1.15,.01)),bx=W*.82,by=cy;
  x.strokeStyle=cu;x.lineWidth=2;x.beginPath();x.moveTo(cx+34,ct+4);x.lineTo(bx,ct+4);x.lineTo(bx,by-22);x.moveTo(cx+34,ct+ch-4);x.lineTo(bx,ct+ch-4);x.lineTo(bx,by+22);x.stroke();x.lineWidth=1;
  if(lvl>.02){const gr=x.createRadialGradient(bx,by,2,bx,by,16+50*lvl);gr.addColorStop(0,'rgba(255,214,90,'+(.25+.75*lvl)+')');gr.addColorStop(1,'rgba(255,214,90,0)');x.fillStyle=gr;x.beginPath();x.arc(bx,by,16+50*lvl,0,7);x.fill()}
  x.fillStyle=lvl>.02?'rgba(255,214,90,'+(.4+.6*lvl)+')':css('--panel');x.strokeStyle=css('--mute');x.beginPath();x.arc(bx,by,16,0,7);x.fill();x.stroke();
  x.fillStyle=css('--mute');x.textAlign='center';x.fillText('전구',bx,by+44);
  mag(x,cx,Y(st.z),18,46);x.fillStyle=css('--mute');x.textAlign='left';x.fillText('코일 '+p.N+'회',cx+42,ct-6);
}
function resetSim(){Object.assign(S,{run:false,t:0,s:[],pmax:0,pmin:0,ymax:.004,done:false,acc:0});M.init(P);$('drop').disabled=false;upd();draw()}
function frame(now){
  if(!S.run)return;const iv=+$('sp').value,sl=+$('sl').value,h=.0002;
  S.acc+=Math.min(.05,(now-S.last)/1000)*sl;S.last=now;
  while(S.acc>=h&&!S.done){S.acc-=h;const e=M.step(P,h);S.t+=h;
    if(S.t>=S.s.length*iv){S.s.push([S.t,e]);if(e>S.pmax)S.pmax=e;if(e<S.pmin)S.pmin=e;S.ymax=Math.max(S.ymax,Math.abs(e)*1.15)}
    if(M.done()){S.done=true;S.run=false;$('drop').disabled=false;
      runs.push({s:S.s,c:PAL[M.cnt%PAL.length],n:++M.cnt,ymax:S.ymax,pmax:S.pmax,pmin:S.pmin,txt:M.defs.map(q=>q.s+' '+P[q.k]+q.u).join(' · ')+(M===MODES[0]&&!$('brake').checked?' · 제동 끔':'')});
      if(runs.length>10)runs.shift();legend()}}
  upd();draw();if(S.run)requestAnimationFrame(frame);
}
$('drop').onclick=()=>{resetSim();S.run=true;$('drop').disabled=true;S.last=performance.now();requestAnimationFrame(frame)};
$('reset').onclick=resetSim;$('clear').onclick=()=>{runs.length=0;legend();resetSim()};
$('brake').onchange=$('sp').onchange=()=>{if(!S.run)resetSim()};
const fmt=v=>Math.abs(v)>=1?v.toFixed(2)+' V':(v*1000).toFixed(1)+' mV';
function legend(){$('legend').innerHTML=runs.map(r=>'<span><i style="background:'+r.c+'"></i>#'+r.n+' '+r.txt+' → 최대 '+fmt(r.pmax)+' / 최소 '+fmt(r.pmin)+'</span>').join('')}
function upd(){$('rt').textContent=S.t.toFixed(3)+' s';$('rv').textContent=M.info();
  $('re').textContent=fmt(S.s.length?S.s[S.s.length-1][1]:0);$('rp').textContent=S.s.length?fmt(S.pmax)+' / '+fmt(S.pmin):'–'}
function buildCtls(){
  $('ctls').innerHTML=M.defs.map(q=>'<div class="ctl"><label for="n_'+q.k+'">'+q.l+'</label><div class="row"><input type="range" id="r_'+q.k+'" min="'+q.min+'" max="'+q.max+'" step="'+q.step+'" value="'+P[q.k]+'" aria-label="'+q.l+' 슬라이더"><input type="number" id="n_'+q.k+'" min="'+q.min+'" max="'+q.max+'" step="'+q.step+'" value="'+P[q.k]+'"><span class="u">'+q.u+'</span></div></div>').join('');
  M.defs.forEach(q=>{const r=$('r_'+q.k),n=$('n_'+q.k);
    const set=v=>{v=+v;if(isNaN(v))return;P[q.k]=v;r.value=v;if(document.activeElement!==n)n.value=v;if(!S.run)resetSim()};
    r.oninput=()=>set(r.value);n.oninput=()=>set(n.value);
    n.onchange=()=>{const v=Math.min(q.max,Math.max(q.min,+n.value||q.min));n.value=v;set(v)}});
}
function setMode(i){
  S.run=false;M=MODES[i];P=M.p;runs=M.runs;buildCtls();$('sl').value=M.sl;$('brakeRow').style.display=M.brake?'flex':'none';
  $('desc').textContent=M.d;$('il').textContent=M.il;
  document.querySelectorAll('.tab').forEach((b,j)=>b.setAttribute('aria-selected',j===i));
  legend();resetSim();
}
$('tabs').innerHTML=MODES.map((m,i)=>'<button class="tab" role="tab" data-i="'+i+'">'+m.t+'</button>').join('');
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setMode(+b.dataset.i));
function fit(c){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;if(c.width!==Math.round(r.width*d)||c.height!==Math.round(r.height*d)){c.width=Math.round(r.width*d);c.height=Math.round(r.height*d)}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,r.width,r.height]}
function niceStep(r,n){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return(f<1.5?1:f<3.5?2:f<7.5?5:10)*p}
function drawGraph(){
  const [x,W,H]=fit($('graph')),L=64,R=14,T=14,B=34,pw=W-L-R,ph=H-T-B;x.clearRect(0,0,W,H);
  const xmax=Math.max(M.xmax(P),S.t*1.02,.05,...runs.map(r=>r.s.length?r.s[r.s.length-1][0]*1.02:0));
  const ym=Math.max(S.ymax,...runs.map(r=>r.ymax)),X=t=>L+t/xmax*pw,Yv=v=>T+ph/2-v/ym*ph/2;
  x.font='11px "Noto Sans KR",sans-serif';x.lineWidth=1;const un=ym<1?1000:1,ys=niceStep(ym*un,4);x.textAlign='right';
  for(let v=-Math.floor(ym*un/ys)*ys;v<=ym*un+1e-9;v+=ys){const yy=Yv(v/un);x.strokeStyle=Math.abs(v)<1e-9?css('--mute'):css('--grid');x.beginPath();x.moveTo(L,yy);x.lineTo(L+pw,yy);x.stroke();x.fillStyle=css('--mute');x.fillText(v.toFixed(ys<1?1:0),L-6,yy+4)}
  const xs=niceStep(xmax,8);x.textAlign='center';
  for(let t=0;t<=xmax+1e-9;t+=xs){const xx=X(t);x.strokeStyle=css('--grid');x.beginPath();x.moveTo(xx,T);x.lineTo(xx,T+ph);x.stroke();x.fillStyle=css('--mute');x.fillText(t.toFixed(xs<.1?2:1),xx,T+ph+16)}
  x.fillStyle=css('--mute');x.fillText('시간 (s)',L+pw/2,H-4);x.save();x.translate(14,T+ph/2);x.rotate(-Math.PI/2);x.fillText('유도 전압 ('+(ym<1?'mV':'V')+')',0,0);x.restore();
  x.strokeStyle=css('--line');x.strokeRect(L,T,pw,ph);
  if(!S.s.length&&!runs.length){x.fillStyle=css('--mute');x.fillText('“실험 시작”을 누르면 측정값이 여기에 그려집니다',L+pw/2,T+ph/2-10);return}
  const line=(s,c,w)=>{x.strokeStyle=c;x.lineWidth=w;x.beginPath();s.forEach(([t,e],i)=>{i?x.lineTo(X(t),Yv(e)):x.moveTo(X(t),Yv(e))});x.stroke()};
  runs.forEach(r=>line(r.s,r.c,1.8));x.lineWidth=1;
  if(S.done||!S.s.length)return;const col=PAL[M.cnt%PAL.length];line(S.s,col,2.2);x.lineWidth=1;
  const l=S.s[S.s.length-1];x.fillStyle=col;x.beginPath();x.arc(X(l[0]),Yv(l[1]),3.5,0,7);x.fill();
}
function draw(){const [x,W,H]=fit($('scene'));x.clearRect(0,0,W,H);M.scene(x,W,H,P);drawGraph()}
addEventListener('resize',draw);matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
setMode(0);
</script>
</body>
