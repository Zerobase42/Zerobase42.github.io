<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전자기 유도 실험</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ef;--panel:#fbfcfb;--ink:#1b2b2c;--mute:#5d6e6e;--line:#cfd8d5;--grid:#e1e8e5;--cu:#b4642a;--n:#c8402f;--s:#2f5fa8;--trace:#08766f;--glass:#dbe7ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#141b1b;--panel:#1c2525;--ink:#e3ecea;--mute:#8fa3a1;--line:#2e3b3b;--grid:#263131;--cu:#e0914f;--n:#e8604d;--s:#5b8fe0;--trace:#3fd1c6;--glass:#2b3a3e}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141b1b;--panel:#1c2525;--ink:#e3ecea;--mute:#8fa3a1;--line:#2e3b3b;--grid:#263131;--cu:#e0914f;--n:#e8604d;--s:#5b8fe0;--trace:#3fd1c6;--glass:#2b3a3e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.55}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 18px;font-size:.92rem}
.top{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
#scene{width:100%;height:460px;display:block}
.ctl{margin-bottom:14px}
.ctl label{display:flex;justify-content:space-between;font-weight:500;font-size:.92rem}
.row{display:flex;gap:10px;align-items:center}
input[type=range]{flex:1;accent-color:var(--cu);min-width:0}
input[type=number],select{width:92px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.u{color:var(--mute);font-size:.85rem;width:2.2em}
.btns{display:flex;gap:8px;margin:6px 0 12px}
button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
button.go{background:var(--cu);border-color:var(--cu);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--trace);outline-offset:2px}
.opt{font-size:.88rem;display:flex;gap:8px;align-items:center;margin-bottom:8px}
.read{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.read div{border-top:1px solid var(--line);padding-top:6px;font-size:.82rem;color:var(--mute)}
.read b{display:block;font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums}
#graphbox{margin-top:16px}
#graph{width:100%;height:320px;display:block}
.note{color:var(--mute);font-size:.8rem;margin:8px 0 0}
@media (max-width:820px){.top{grid-template-columns:1fr}#scene{height:400px}}
</style>
</head>
<body>
<main>
<h1>전자기 유도 실험</h1>
<p class="sub">자석이 코일을 통과할 때 유도되는 전압을 측정합니다. 값을 정하고 “떨어뜨리기”를 누르세요.</p>
<div class="top">
  <div class="box"><canvas id="scene"></canvas></div>
  <div class="box">
    <div class="ctl"><label for="Bn">자석의 세기 <span></span></label><div class="row"><input type="range" id="Br" min="0.05" max="1.5" step="0.05" value="0.5" aria-label="자석의 세기 슬라이더"><input type="number" id="Bn" min="0.05" max="1.5" step="0.05" value="0.5"><span class="u">T</span></div></div>
    <div class="ctl"><label for="hn">떨어뜨리는 높이 <span></span></label><div class="row"><input type="range" id="hr" min="0.05" max="2" step="0.05" value="0.5" aria-label="높이 슬라이더"><input type="number" id="hn" min="0.05" max="2" step="0.05" value="0.5"><span class="u">m</span></div></div>
    <div class="ctl"><label for="Nn">코일의 감은 횟수 <span></span></label><div class="row"><input type="range" id="Nr" min="10" max="2000" step="10" value="500" aria-label="감은 횟수 슬라이더"><input type="number" id="Nn" min="10" max="2000" step="10" value="500"><span class="u">회</span></div></div>
    <div class="ctl"><label for="sp">측정 간격</label><div class="row"><select id="sp"><option value="0.001">1 ms</option><option value="0.002" selected>2 ms</option><option value="0.005">5 ms</option></select><select id="sl"><option value="1">실제 속도</option><option value="0.25" selected>0.25배속</option><option value="0.1">0.1배속</option></select></div></div>
    <label class="opt"><input type="checkbox" id="brake" checked>렌츠 법칙에 의한 자기 제동 반영</label>
    <div class="btns"><button class="go" id="drop">떨어뜨리기</button><button id="reset">초기화</button></div>
    <div class="read">
      <div>경과 시간<b id="rt">0.000 s</b></div><div>현재 속력<b id="rv">0.00 m/s</b></div>
      <div>현재 유도 전압<b id="re">0.0 mV</b></div><div>최대 / 최소 전압<b id="rp">–</b></div>
    </div>
  </div>
</div>
<div class="box" id="graphbox">
  <strong>시간–유도 전압 그래프</strong>
  <canvas id="graph"></canvas>
  <p class="note">자석은 이상적인 자기 쌍극자, 코일은 반지름 3 cm·길이 6 cm로 근사한 계산입니다. 전압은 상대적인 크기를 비교하기 위한 값이며, 중력가속도는 9.8 m/s²입니다.</p>
</div>
</main>
<script>
const $=id=>document.getElementById(id), g=9.8, a=0.03, Lc=0.06, M=0.03, floorZ=-0.28;
const P={B:.5,h:.5,N:500};
[['B','B'],['h','h'],['N','N']].forEach(([k,id])=>{
  const r=$(id+'r'),n=$(id+'n');
  const set=v=>{v=+v;if(isNaN(v))return;P[k]=v;r.value=v;if(document.activeElement!==n)n.value=v;if(!S.run)resetSim()};
  r.oninput=()=>set(r.value);n.oninput=()=>set(n.value);
  n.onchange=()=>{let v=Math.min(+n.max,Math.max(+n.min,+n.value||+n.min));n.value=v;set(v)};
});
const S={run:false,t:0,z:0,v:0,s:[],pmax:0,pmin:0,ymax:0.01,last:0,acc:0,done:false};
const K=30; // 코일 분할 수
function emfAt(z,v){
  const m=P.B*3e-6; let s=0;
  for(let k=0;k<K;k++){const d=z-(-Lc/2+Lc*(k+.5)/K);s+=3*a*a*d/(2*Math.pow(a*a+d*d,2.5))}
  return m*P.N*s/K*v;
}
function resetSim(){
  Object.assign(S,{run:false,t:0,z:P.h+0.03,v:0,s:[],pmax:0,pmin:0,ymax:0.01,done:false,acc:0});
  $('drop').disabled=false;upd();draw();
}
function step(dt){
  let e=emfAt(S.z,S.v),acc=g;
  if($('brake').checked&&Math.abs(S.v)>1e-3){const R=P.N*0.02;acc-=Math.min(g*0.98,e*e/(R*Math.abs(S.v))/M)}
  S.v+=acc*dt;S.z-=S.v*dt;S.t+=dt;return emfAt(S.z,S.v);
}
function frame(now){
  if(!S.run)return;
  const sl=+$('sl').value, interval=+$('sp').value;
  let real=Math.min(0.05,(now-S.last)/1000);S.last=now;S.acc+=real*sl;
  const h=0.0002;
  while(S.acc>=h&&!S.done){
    S.acc-=h;const e=step(h);
    if(S.t>=S.s.length*interval){S.s.push([S.t,e]);if(e>S.pmax)S.pmax=e;if(e<S.pmin)S.pmin=e;S.ymax=Math.max(S.ymax,Math.abs(e)*1.15)}
    if(S.z<floorZ){S.done=true;S.run=false;$('drop').disabled=false}
  }
  upd();draw();
  if(S.run)requestAnimationFrame(frame);
}
$('drop').onclick=()=>{resetSim();S.run=true;$('drop').disabled=true;S.last=performance.now();requestAnimationFrame(frame)};
$('reset').onclick=resetSim;$('brake').onchange=()=>{if(!S.run)resetSim()};
$('sp').onchange=()=>{if(!S.run)resetSim()};
const fmt=v=>Math.abs(v)>=1?v.toFixed(2)+' V':(v*1000).toFixed(1)+' mV';
function upd(){
  $('rt').textContent=S.t.toFixed(3)+' s';$('rv').textContent=Math.abs(S.v).toFixed(2)+' m/s';
  const e=S.s.length?S.s[S.s.length-1][1]:0;$('re').textContent=fmt(e);
  $('rp').textContent=S.s.length?fmt(S.pmax)+' / '+fmt(S.pmin):'–';
}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function fit(c){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;if(c.width!==Math.round(r.width*d)||c.height!==Math.round(r.height*d)){c.width=Math.round(r.width*d);c.height=Math.round(r.height*d)}const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return[x,r.width,r.height]}
function drawScene(){
  const [x,W,H]=fit($('scene')),cx=W*0.42,cy=H*0.62;
  x.clearRect(0,0,W,H);
  const top=P.h+0.03;
  const Y=z=>{const ad=Math.abs(z),sg=z>=0?-1:1;
    if(ad<=0.08)return cy+sg*ad*400;
    if(z>0)return cy-32-(z-0.08)/(top-0.08)*(cy-32-46);
    return cy+32+(ad-0.08)/(0.2)*(H-cy-32-26)};
  // 높이 눈금
  x.strokeStyle=css('--line');x.fillStyle=css('--mute');x.font='12px "Noto Sans KR",sans-serif';x.setLineDash([4,4]);
  const y0=Y(top);x.beginPath();x.moveTo(cx-90,y0);x.lineTo(cx+90,y0);x.stroke();x.setLineDash([]);
  x.textAlign='right';x.fillText('낙하 시작 '+P.h.toFixed(2)+' m',cx-96,y0+4);
  x.fillText('코일 중심 0',cx-96,cy+4);
  // 유리관
  x.fillStyle=css('--glass');x.fillRect(cx-14,36,28,H-52);
  x.strokeStyle=css('--line');x.strokeRect(cx-14,36,28,H-52);
  // 바닥 스펀지
  x.fillStyle=css('--line');x.fillRect(cx-40,H-16,80,8);
  // 코일 감김
  const turns=Math.min(34,Math.round(4+P.N/70)),cu=css('--cu');
  const ct=cy-34,ch=68;
  x.strokeStyle=cu;x.lineWidth=2.4;
  for(let i=0;i<turns;i++){const yy=ct+(i+.5)*ch/turns;x.beginPath();x.ellipse(cx,yy,34,7,0,0,Math.PI*2);x.stroke()}
  x.lineWidth=1;
  // 도선 + 전구
  const e=S.s.length?S.s[S.s.length-1][1]:0,lvl=Math.min(1,Math.abs(e)/Math.max(S.ymax/1.15,0.02));
  const bx=W*0.82,by=cy;
  x.strokeStyle=cu;x.lineWidth=2;x.beginPath();x.moveTo(cx+34,ct+4);x.lineTo(bx,ct+4);x.lineTo(bx,by-22);x.moveTo(cx+34,ct+ch-4);x.lineTo(bx,ct+ch-4);x.lineTo(bx,by+22);x.stroke();x.lineWidth=1;
  if(lvl>0.02){const gr=x.createRadialGradient(bx,by,2,bx,by,16+50*lvl);gr.addColorStop(0,'rgba(255,214,90,'+(0.25+0.75*lvl)+')');gr.addColorStop(1,'rgba(255,214,90,0)');x.fillStyle=gr;x.beginPath();x.arc(bx,by,16+50*lvl,0,7);x.fill()}
  x.fillStyle=lvl>0.02?'rgba(255,214,90,'+(0.4+0.6*lvl)+')':css('--panel');x.strokeStyle=css('--mute');x.beginPath();x.arc(bx,by,16,0,7);x.fill();x.stroke();
  x.fillStyle=css('--mute');x.textAlign='center';x.fillText('전구',bx,by+44);
  // 자석
  const my=Y(S.z),mw=18,mh=46;
  x.fillStyle=css('--n');x.fillRect(cx-mw/2,my-mh/2,mw,mh/2);
  x.fillStyle=css('--s');x.fillRect(cx-mw/2,my,mw,mh/2);
  x.fillStyle='#fff';x.font='bold 12px sans-serif';x.fillText('N',cx,my-6);x.fillText('S',cx,my+17);
  x.fillStyle=css('--mute');x.font='12px "Noto Sans KR",sans-serif';x.textAlign='left';x.fillText('코일 '+P.N+'회',cx+42,ct-6);
}
function drawGraph(){
  const [x,W,H]=fit($('graph')),L=64,R=14,T=14,B=34,pw=W-L-R,ph=H-T-B;
  x.clearRect(0,0,W,H);
  const free=Math.sqrt(2*(P.h+0.03-floorZ)/g),xmax=Math.max(free*1.08,S.t*1.02,0.05);
  const ym=S.ymax,X=t=>L+t/xmax*pw,Yv=v=>T+ph/2-v/ym*ph/2;
  x.font='11px "Noto Sans KR",sans-serif';x.lineWidth=1;
  const unit=ym<1?1000:1,uname=ym<1?'mV':'V';
  const ys=niceStep(ym*unit,4);
  x.textAlign='right';
  for(let v=-Math.floor(ym*unit/ys)*ys;v<=ym*unit+1e-9;v+=ys){const yy=Yv(v/unit);x.strokeStyle=Math.abs(v)<1e-9?css('--mute'):css('--grid');x.beginPath();x.moveTo(L,yy);x.lineTo(L+pw,yy);x.stroke();x.fillStyle=css('--mute');x.fillText(v.toFixed(ys<1?1:0),L-6,yy+4)}
  const xs=niceStep(xmax,8);x.textAlign='center';
  for(let t=0;t<=xmax+1e-9;t+=xs){const xx=X(t);x.strokeStyle=css('--grid');x.beginPath();x.moveTo(xx,T);x.lineTo(xx,T+ph);x.stroke();x.fillStyle=css('--mute');x.fillText(t.toFixed(xs<0.1?2:1),xx,T+ph+16)}
  x.fillStyle=css('--mute');x.fillText('시간 (s)',L+pw/2,H-4);
  x.save();x.translate(14,T+ph/2);x.rotate(-Math.PI/2);x.fillText('유도 전압 ('+uname+')',0,0);x.restore();
  x.strokeStyle=css('--line');x.strokeRect(L,T,pw,ph);
  if(!S.s.length){x.fillStyle=css('--mute');x.textAlign='center';x.fillText('“떨어뜨리기”를 누르면 측정값이 여기에 그려집니다',L+pw/2,T+ph/2-10);return}
  x.strokeStyle=css('--trace');x.lineWidth=2;x.beginPath();
  S.s.forEach(([t,e],i)=>{i?x.lineTo(X(t),Yv(e)):x.moveTo(X(t),Yv(e))});x.stroke();x.lineWidth=1;
  const l=S.s[S.s.length-1];x.fillStyle=css('--trace');x.beginPath();x.arc(X(l[0]),Yv(l[1]),3.5,0,7);x.fill();
}
function niceStep(r,n){const raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return(f<1.5?1:f<3.5?2:f<7.5?5:10)*p}
function draw(){drawScene();drawGraph()}
addEventListener('resize',draw);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
resetSim();
</script>
</body>
</html>
