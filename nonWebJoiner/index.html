<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Viewer</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    display: flex;
    flex-direction: column;
}

#toolbar {
    display: flex;
    gap: 8px;
    padding: 8px;
    border-bottom: 1px solid #ccc;
}

#url {
    flex: 1;
    font-size: 16px;
    padding: 8px;
}

iframe {
    flex: 1;
    width: 100%;
    border: none;
}
</style>
</head>
<body>

<div id="toolbar">
    <input
        id="url"
        type="text"
        value="https://example.com"
        placeholder="https://..."
    >
    <button id="go">이동</button>
</div>

<iframe
    id="viewer"
    src="https://example.com">
</iframe>

<script>
const urlInput = document.getElementById("url");
const viewer = document.getElementById("viewer");

function loadPage() {
    let url = urlInput.value.trim();

    if (!/^https?:\/\//.test(url)) {
        url = "https://" + url;
    }

    viewer.src = url;
}

document.getElementById("go").onclick = loadPage;
urlInput.addEventListener("keydown", e => {
    if (e.key === "Enter") loadPage();
});
</script>

</body>
</html>
