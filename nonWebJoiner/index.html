<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Viewer</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    display:flex;
    flex-direction:column;
}

#toolbar{
    display:flex;
    gap:8px;
    padding:8px;
    border-bottom:1px solid #ddd;
}

#url{
    flex:1;
    padding:8px;
    font-size:16px;
}

button{
    padding:8px 16px;
    cursor:pointer;
}

iframe{
    flex:1;
    width:100%;
    border:none;
}
</style>
</head>
<body>

<div id="toolbar">
    <input
        id="url"
        value="https://example.com"
        placeholder="https://..."
    >
    <button id="go">Go</button>
</div>

<iframe id="viewer">
  <p>사용 중인 브라우저는 iframe을 지원하지 않습니다.</p>
</iframe>

<script>
const url = document.getElementById("url");
const viewer = document.getElementById("viewer");

const notice = document.createElement("div");
notice.id = "notice";
notice.style.display = "none";
notice.style.padding = "10px";
notice.style.background = "#fff3cd";
notice.style.color = "#856404";
notice.style.borderBottom = "1px solid #ffeeba";
notice.textContent =
    "페이지를 표시할 수 없습니다. 이 사이트는 iframe 삽입을 차단했을 수 있습니다.";

document.body.insertBefore(notice, viewer);

let timeoutId;

function openPage() {
    let link = url.value.trim();

    if (!link) return;

    if (!/^https?:\/\//i.test(link)) {
        link = "https://" + link;
    }

    notice.style.display = "none";

    clearTimeout(timeoutId);

    viewer.src = "about:blank";

    setTimeout(() => {
        viewer.src = link;

        timeoutId = setTimeout(() => {
            notice.style.display = "block";
        }, 5000);

        history.replaceState(
            {},
            "",
            "?url=" + encodeURIComponent(link)
        );
    }, 50);
}

viewer.addEventListener("load", () => {
    clearTimeout(timeoutId);

    try {
        const frameUrl = viewer.contentWindow.location.href;

        if (
            frameUrl === "about:blank" ||
            frameUrl === "about:srcdoc"
        ) {
            notice.style.display = "block";
        } else {
            notice.style.display = "none";
        }
    } catch (e) {
        // 외부 사이트는 Same-Origin Policy 때문에 접근 불가.
        // 로드 이벤트가 발생했다면 일단 성공한 것으로 간주.
        notice.style.display = "none";
    }
});

document.getElementById("go").addEventListener("click", openPage);

url.addEventListener("keydown", e => {
    if (e.key === "Enter") {
        openPage();
    }
});

const params = new URLSearchParams(location.search);

if (params.has("url")) {
    url.value = params.get("url");
}

openPage();
</script>

</body>
</html>
