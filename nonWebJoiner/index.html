<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Viewer</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    display:flex;
    flex-direction:column;
}

#toolbar{
    display:flex;
    gap:8px;
    padding:8px;
    border-bottom:1px solid #ddd;
}

#url{
    flex:1;
    padding:8px;
    font-size:16px;
}

button{
    padding:8px 16px;
    cursor:pointer;
}

iframe{
    flex:1;
    width:100%;
    border:none;
}
</style>
</head>
<body>

<div id="toolbar">
    <input
        id="url"
        value="https://example.com"
        placeholder="https://..."
    >
    <button id="go">Go</button>
</div>

<iframe id="viewer"></iframe>

<script>
const url=document.getElementById("url");
const viewer=document.getElementById("viewer");

function openPage(){
    let link=url.value.trim();

    if(!/^https?:\/\//.test(link)){
        link="https://"+link;
    }

    viewer.src=link;

    history.replaceState(
        {},
        "",
        "?url="+encodeURIComponent(link)
    );
}

document.getElementById("go").onclick=openPage;

url.addEventListener("keydown",e=>{
    if(e.key==="Enter") openPage();
});

const params=new URLSearchParams(location.search);

if(params.has("url")){
    url.value=params.get("url");
}

openPage();
</script>

</body>
</html>
