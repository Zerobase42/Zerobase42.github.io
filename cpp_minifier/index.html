<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C++ Minifier — Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="back" href="../index.html">← index</a>
  <main class="wrap">
    <h1>cpp-minify <span class="cmd">--watch</span></h1>

    <div class="window">
        <div class="tabbar">
            <div class="tab active">
                <span class="lang">●</span>
                input.cpp
            </div>
        </div>
        <div class="colorscripter-wrapper">
            <div class="codebox">
                <div id="lineNumbers">
                    1
                </div>

                <div class="editor-container">

                    <pre id="input-highlight">
    <code id="input-code" class="language-cpp"></code>
                    </pre>

                    <textarea
                        id="input"
                        spellcheck="false"
                        placeholder="#include <bits/stdc++.h>"
                    ></textarea>

                </div>

            </div>
        </div>
    </div>

    <div class="controls">
     <button class="run" id="minify-btn">Minify</button>
      <label class="toggle">
        <input type="checkbox" id="switch" checked>
        <span class="track"></span>
      </label>
    </div>

    <h2>Output</h2>
    <div class="window">
      <div class="tabbar">
        <div class="tab active"><span class="lang">●</span> minify.cpp</div>
      </div>
      <div class="editor">
        <div class="gutter" aria-hidden="true"><span>1</span></div>
        <pre id="output-highlight">
        <code id="output-code"
            class="language-cpp"></code>
        </pre>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/cpp.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
