<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>C++ Minifier</title>

    <style>
        #output{
            white-space: pre-wrap;
            border:1px solid black;
            padding:10px;
            width:650px;
            min-height:300px;
            overflow:auto;
        }
    </style>
    <link rel="stylesheet" href="button.css">
</head>

<body>

<h1>C++ Minifier</h1>

<textarea id="input" rows="20" cols="80"></textarea>

<br><br>

<button onclick="minifyCode()">Minify</button>

<div class="option-bar">
    <input type="checkbox" id="switch" checked>

    <label for="switch" class="switch_label">
        <span class="onf_btn"></span>
    </label>

    <label for="switch" class="option-text">
        주석 삭제
    </label>
</div>

<h2>Output</h2>

<pre id="output"></pre>

<script src="script.js"></script>

</body>
</html>
