<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C++ Minifier — Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="back" href="../index.html">← index</a>
  <main class="wrap">
    <h1>cpp-minify <span class="cmd">--watch</span></h1>

    <div class="window">
        <div class="tabbar">
            <div class="tab active">
                <span class="lang">●</span>
                input.cpp
            </div>
        </div>
        <div class="colorscripter-wrapper">
            <div class="codebox">
                <div id="lineNumbers">
                    1
                </div>
                <textarea
                    id="input"
                    spellcheck="false"
                    placeholder="#include <bits/stdc++.h>"
                ></textarea>
            </div>
        </div>
    </div>

    <div class="controls">
      <label class="toggle">
        <input type="checkbox" id="switch" checked>
        <span class="track"></span>
        <span><span class="hash">--</span>strip-comments · 주석 삭제</span>
      </label>
    </div>

    <h2>Output</h2>
    <div class="window">
      <div class="tabbar">
        <div class="tab active"><span class="lang">●</span> output.min.cpp</div>
      </div>
      <div class="editor">
        <div class="gutter" aria-hidden="true"><span>1</span></div>
        <textarea id="output" spellcheck="false" readonly placeholder="// minified result →"></textarea>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
